# Development Docker Compose Configuration
# Usage: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reimbursement_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reimbursement_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/migrate-approvals.sql:/docker-entrypoint-initdb.d/02-migrate-approvals.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data_dev:
