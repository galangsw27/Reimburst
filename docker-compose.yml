version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: reimbursement_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reimbursement_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/migrate-approvals.sql:/docker-entrypoint-initdb.d/02-migrate-approvals.sql
      - ./scripts/approval-flow-migration.sql:/docker-entrypoint-initdb.d/03-approval-flow-migration.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: reimbursement_app
    environment:
      - NODE_ENV=production
      # Use DATABASE_URL from env if available (Railway), otherwise use local postgres
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/reimbursement_db}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - NEXT_PUBLIC_WEBHOOK_URL=${NEXT_PUBLIC_WEBHOOK_URL}
      - NEXT_PUBLIC_ASSET_MATCH_WEBHOOK_URL=${NEXT_PUBLIC_ASSET_MATCH_WEBHOOK_URL}
      - NEXT_PUBLIC_MAXSTREAM_WEBHOOK_URL=${NEXT_PUBLIC_MAXSTREAM_WEBHOOK_URL}
      - NEXT_PUBLIC_MYORBIT_WEBHOOK_URL=${NEXT_PUBLIC_MYORBIT_WEBHOOK_URL}
      - NEXT_PUBLIC_DUNIAGAMES_WEBHOOK_URL=${NEXT_PUBLIC_DUNIAGAMES_WEBHOOK_URL}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - PORT=${PORT:-3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
