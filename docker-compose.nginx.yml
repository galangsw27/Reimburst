# Docker Compose with Nginx Reverse Proxy
# Usage: docker-compose -f docker-compose.yml -f docker-compose.nginx.yml up -d

version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: reimbursement_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nginx_logs:
